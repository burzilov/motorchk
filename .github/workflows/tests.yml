name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-interaction --no-progress
      - name: Run core tests
        run: |
          for t in plugins i18n themes toast plugin-updates forms seo maintenance; do
            php "tests/$t.php" || exit 1
          done
